server:
  port: 8100
  tomcat:
    uri-encoding: UTF-8
spring:
  application:
    name: agent-service
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  cloud:
    nacos:
      discovery:
        server-addr: 192.168.150.101:8848
        register-enabled: false
        fail-fast: false
      config:
        server-addr: 192.168.150.101:8848
        file-extension: yaml
        shared-configs:
          - data-id: shared-spring.yaml
            refresh: false
          - data-id: shared-mybatis.yaml
            refresh: false
          - data-id: shared-logs.yaml
            refresh: false
          - data-id: shared-feign.yaml
            refresh: false
          - data-id: shared-mq.yaml
            refresh: false
          - data-id: shared-xxljob.yaml
            refresh: false
    openfeign:
      client:
        config:
          learning-service:
            url: http://learning-service:8090
  datasource:
    url: jdbc:mysql://192.168.150.101:3306/tj_agent?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
    username: root
    password: 123
    driver-class-name: com.mysql.cj.jdbc.Driver
  redis:
    host: redis
    port: 6379
    password: 123321
  elasticsearch:
    uris: http://es:9200

tj:
  agent:
    llm:
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY:your-api-key-here}
      model-name: deepseek-v4-pro
      temperature: 0.3
      max-tokens: 2048
      timeout: 60
    sync:
      course-ids: 1,2,3
